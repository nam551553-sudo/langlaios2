apply plugin: 'java'
apply plugin: 'robovm'
sourceSets.main.java {
    srcDirs = ['src', '../src']
    exclude 'com/beatdz/langlalau/**'
}
sourceSets.test.java.srcDirs = ['tests']
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
ext.mainClassName = 'com.zenovux.langla.IOSLauncher'
dependencies {
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.mobidevelop.robovm:robovm-rt:$roboVMVersion"
    implementation "com.mobidevelop.robovm:robovm-cocoatouch:$roboVMVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-robovm:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-ios"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-ios"
}
robovm { archs = 'arm64' }
tasks.register('syncGameAssets', Sync) {
    from(rootProject.projectDir) { include 'resource/**', 'music/**', 'sound/**' }
    into layout.buildDirectory.dir('game-assets')
}
tasks.named('classes') { dependsOn 'syncGameAssets' }

tasks.register('verifyAssetStreams', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'AssetReaderTest'
}

tasks.register('verifyIosContent', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'IosContentTest'
}

tasks.register('verifyIosStartup', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'IosStartupTest'
    timeout = java.time.Duration.ofSeconds(30)
}

tasks.register('verifyIosNetworkApi', JavaExec) {
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'IosNetworkApiTest'
    doFirst {
        args = [configurations.runtimeClasspath.find { it.name.startsWith('robovm-rt-') }.absolutePath]
    }
}
