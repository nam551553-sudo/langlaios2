name: Build iOS IPA - Compact UI
on:
  push:
    branches: [ipa-lang-la-duck]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build unsigned IPA
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_16.4.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          chmod +x gradlew
          ./gradlew -PwithIos -PiosOnly -Probovm.iosSkipSigning=true :ios:createIPA --max-workers=2 --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LangLa-iOS-unsigned
          path: ios/**/*.ipa
          if-no-files-found: error