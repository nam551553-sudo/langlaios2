name: Build iOS IPA

on:
  push:
    branches: [main, codex/wheel-map-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply prepared visual fixes
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, zipfile, shutil
          parts = sorted(pathlib.Path('build-inputs/visual-fixes-parts').glob('*.part'))
          assert len(parts) == 34, len(parts)
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '6d07ca8e8340a87484ee57b53ee318a4b134884502a1e0c726ec6998909088f4'
          target = pathlib.Path('build-inputs/visual-fixes.zip')
          target.write_bytes(data)
          with zipfile.ZipFile(target) as archive:
              archive.extractall('.')
          for source in pathlib.Path('build-inputs/visual-tuning').glob('*.java'):
              shutil.copyfile(source, pathlib.Path('src/beatdz') / source.name)
          PY
      - name: Apply wheel and map fixes
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, zipfile, io
          parts = sorted(pathlib.Path('build-inputs/wheel-map-parts').glob('*.part'))
          assert len(parts) == 32, len(parts)
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '000a67f4c74268faac3805de227f919fcd11bdb962f4cdca2a42225af03267f5'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall('.')
          PY
      - name: Test asset downloader
        run: |
          python3 ios/tools/validate-assets.py
          mkdir -p ios/build/audit-tests
          javac -encoding UTF-8 -d ios/build/audit-tests src/beatdz/AssetHttp.java ios/tests/AssetHttpTest.java
          java -Xmx512m -cp ios/build/audit-tests AssetHttpTest
      - name: Select installed Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build unsigned arm64 IPA
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PwithIos -PiosOnly -Probovm.iosSkipSigning=true -Probovm.archs=arm64 :ios:verifyIosNetworkApi :ios:verifyAssetStreams :ios:verifyIosContent :ios:verifyIosStartup :ios:createIPA --console=plain --stacktrace 2>&1 | tee ios-build.log
      - name: Validate IPA contents
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, plistlib, shutil
          ipas = list(pathlib.Path('ios').rglob('*.ipa'))
          assert ipas, 'RoboVM did not produce an IPA'
          for ipa in ipas:
              with zipfile.ZipFile(ipa) as archive:
                  names = archive.namelist()
                  for suffix in ['/IOSLauncher', '/Info.plist', '/resource/a', '/resource/font1.ttf']:
                      assert any(n.startswith('Payload/') and n.endswith(suffix) for n in names), suffix
                  info = plistlib.loads(archive.read('Payload/IOSLauncher.app/Info.plist'))
                  assert info['CFBundleDisplayName'] == 'Làng Lá Kage', info['CFBundleDisplayName']
                  assert info['DeveloperName'] == 'Krin'
                  assert info['CFBundleVersion'] == '8'
                  assert 'Payload/IOSLauncher.app/data/arr_data_game.beatdz' in names
                  assert 'Payload/IOSLauncher.app/data/2/client_icon_14.beatdz' in names
              output = pathlib.Path('ipa-output')
              output.mkdir(exist_ok=True)
              shutil.copyfile(ipa, output / 'Làng Lá Kage.ipa')
              print(ipa, ipa.stat().st_size, 'bytes')
          PY
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lang-La-Kage-iOS-unsigned
          path: ipa-output/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore


