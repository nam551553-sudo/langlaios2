name: Build Duck iOS IPA
on: [push]
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build unsigned arm64 IPA
        run: |
          cat input/part-* > source.zip
          unzip -q source.zip
          unzip -oq overlay.zip
          cp SeasonalEventDialog.java src/beatdz/
          cp cape/*.java src/beatdz/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/beatdz/Char.java')
          s = p.read_text()
          assert 'pixels * size * 90 / 10000' in s
          p.write_text(s.replace('pixels * size * 90 / 10000', 'pixels * size * 99 / 10000').replace('120.0 * zoom / width, 38.0 * zoom / height', '132.0 * zoom / width, 41.8 * zoom / height'))
          PY
          chmod +x gradlew
          ./gradlew -PwithIos -PiosOnly -Probovm.iosSkipSigning=true -Probovm.archs=arm64 :ios:createIPA -x :ios:test --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: LangLa-Duck-iOS
          path: ios/**/*.ipa
          if-no-files-found: error
